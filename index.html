
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#086335">
  <title>EduSpark | Digital Solution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-box">
      <div class="brand-mark">ES</div>
      <h1>EduSpark</h1>
      <p>Digital Solution · Admin Login</p>

      <label for="loginEmail">Admin Email</label>
      <input id="loginEmail" type="email"
        autocomplete="username" required
        placeholder="আপনার Admin Email">

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password"
        autocomplete="current-password" required
        placeholder="আপনার Password">

      <button id="loginButton" class="btn primary full" type="submit">
        Login
      </button>

      <button id="resetPassword" class="link-button" type="button">
        পাসওয়ার্ড ভুলে গেছেন?
      </button>

      <p id="loginMessage" class="message" role="status"></p>
    </form>
  </section>

  <div id="appShell" hidden>
    <header class="topbar">
      <button id="mobileMenu" class="icon-button"
        aria-label="মেনু">☰</button>

      <div class="brand">
        <div class="brand-mark small">ES</div>
        <div>
          <b>EduSpark</b>
          <small>Digital Solution</small>
        </div>
      </div>

      <div class="top-actions">
        <span id="adminLabel">Admin</span>
        <button id="logoutButton" class="btn danger">Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="nav-caption">MAIN MENU</div>
        <button class="nav-item active" data-page="Dashboard">
          🏠 Dashboard <span>ড্যাশবোর্ড</span>
        </button>

        <div class="nav-caption">ACADEMIC</div>
        <button class="nav-item" data-page="Students">
          🎓 Students <span>শিক্ষার্থী</span>
        </button>
        <button class="nav-item" data-page="Teachers">
          👨‍🏫 Teachers <span>শিক্ষক</span>
        </button>
        <button class="nav-item" data-page="Staff">
          👥 Staff <span>কর্মচারী</span>
        </button>
        <button class="nav-item" data-page="Admission">
          📝 Admission <span>ভর্তি</span>
        </button>
        <button class="nav-item" data-page="Attendance">
          📅 Attendance <span>উপস্থিতি</span>
        </button>
        <button class="nav-item" data-page="Classes">
          📚 Classes <span>শ্রেণি</span>
        </button>
        <button class="nav-item" data-page="Results">
          📊 Results <span>ফলাফল</span>
        </button>

        <div class="nav-caption">MANAGEMENT</div>
        <button class="nav-item" data-page="Fees">
          💰 Fees <span>বেতন ও ফি</span>
        </button>
        <button class="nav-item" data-page="Notices">
          📢 Notices <span>নোটিশ</span>
        </button>
        <button class="nav-item" data-page="Settings">
          ⚙️ Settings <span>সেটিংস</span>
        </button>
      </aside>

      <main id="mainContent" class="main-content"></main>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
